version: 2
updates:
  # Rust 의존성 주간 업데이트
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    # The newer releases require Rust 1.88 and the workspace supports Rust 1.85.
    ignore:
      - dependency-name: "globset"
        versions: ["> 0.4.19"]
      - dependency-name: "proptest"
        versions: ["> 1.11.0"]
    groups:
      rust-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions 워크플로 점검
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
