name: Release verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-compatibility:
    name: Rust ${{ matrix.rust }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85.0", "1.95.0"]
        os: [ubuntu-latest, macos-latest]
    env:
      # A job selection must override the repository's release default.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Selected compatible Rust compiler
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          echo "RUSTC=$(rustup which --toolchain "$RUSTUP_TOOLCHAIN" rustc)" >> "$GITHUB_ENV"
          echo "RUSTDOC=$(rustup which --toolchain "$RUSTUP_TOOLCHAIN" rustdoc)" >> "$GITHUB_ENV"
      - name: Record actual build selection
        run: |
          mkdir -p verification
          { "$RUSTC" --version --verbose; rustup run "$RUSTUP_TOOLCHAIN" cargo --version; git rev-parse HEAD; } > verification/versions.txt
      - name: Locked workspace build
        run: rustup run "$RUSTUP_TOOLCHAIN" cargo build --workspace --locked 2>&1 | tee verification/build.log
      - name: Workspace tests including isolated binary execution
        run: rustup run "$RUSTUP_TOOLCHAIN" cargo test --workspace --locked 2>&1 | tee verification/tests.log
      - name: Preserve dependency resolution
        run: git diff --exit-code -- Cargo.lock
      - name: Upload compatibility observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-compatibility-${{ matrix.rust }}-${{ matrix.os }}-${{ github.sha }}
          path: verification/
          if-no-files-found: warn
          retention-days: 30
  knowledge-graph:
    # Documentation-graph validation only; see the AGENTS.md language-policy exception.
    name: lat.md knowledge graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Pinned lat.md CLI
        run: npm install --global --ignore-scripts lat.md@0.12.2
      - name: Links and code references
        run: lat check
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          mkdir -p verification
          { rustc --version; cargo --version; cargo deny --version; cargo audit --version; git rev-parse HEAD; } > verification/versions.txt
      - name: Format
        run: cargo fmt --all --check 2>&1 | tee verification/fmt.log
      - name: Locked workspace check
        run: cargo check --workspace --locked 2>&1 | tee verification/check.log
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee verification/clippy.log
      - name: Workspace tests
        run: cargo test --workspace --locked 2>&1 | tee verification/tests.log
      - name: Deterministic schemas
        run: |
          cargo run --locked -p xtask -- schema
          git diff --exit-code -- schemas
          test -z "$(git ls-files --others --exclude-standard -- schemas)"
      - name: Dependency policy
        run: cargo deny check 2>&1 | tee verification/deny.log
      - name: Advisory audit
        run: cargo audit 2>&1 | tee verification/audit.log
      - name: Runtime residue and public API
        run: |
          cargo run --locked -p xtask -- check-residue 2>&1 | tee verification/residue.log
          cargo doc --no-deps --locked -p policy-core -p policy-contracts
          cargo run --locked -p xtask -- check-public-api target/doc schemas 2>&1 | tee verification/public-api.log
      - name: Clean build with empty target
        run: |
          clean_target=$(mktemp -d "$RUNNER_TEMP/policy-clean.XXXXXX")
          CARGO_TARGET_DIR="$clean_target" cargo build --workspace --locked 2>&1 | tee verification/clean-build.log
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-${{ github.sha }}
          path: verification/
          if-no-files-found: warn
          retention-days: 30
