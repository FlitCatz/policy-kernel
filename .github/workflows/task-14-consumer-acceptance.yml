name: Native consumer compatibility acceptance
on:
  pull_request:
    paths:
      - 'acceptance/**'
      - 'examples/**'
      - 'bootstrap/**'
      - 'crates/project-verification/**'
      - 'crates/evidence-collector/**'
      - 'crates/policy-core/**'
      - 'crates/policy-contracts/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/task-14-consumer-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    name: Native ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [react-typescript, dotnet, fullstack]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Selected Rust build tools
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Derive runtime choices from the reviewed profile
        id: selection
        run: cargo run --locked -p project-verification -- ci-inputs 'bootstrap/templates/1.1.0/profiles/${{ matrix.profile }}/profile.json' --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.profile != 'dotnet'
        with:
          node-version: ${{ steps.selection.outputs.node_version }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: matrix.profile != 'react-typescript'
        with:
          dotnet-version: ${{ steps.selection.outputs.dotnet_version }}
      - name: Provision the selected npm release
        if: matrix.profile != 'dotnet'
        run: |
          cargo run --locked -p project-verification -- provision-npm 'bootstrap/templates/1.1.0/profiles/${{ matrix.profile }}/profile.json' --prefix '${{ runner.temp }}/selected-npm'
          echo '${{ runner.temp }}/selected-npm/node_modules/.bin' >> "$GITHUB_PATH"
      - name: Acceptance orchestration and trust regressions
        run: cargo test --locked -p policy-acceptance -p policy-bootstrap -p project-verification -p policy-core
      - name: Native baseline, isolated failures and corrected heads
        run: cargo run --locked -p policy-acceptance -- run --profile '${{ matrix.profile }}' --output '${{ runner.temp }}/task14-${{ matrix.profile }}' --provision
      - name: Retain observations, raw reports and provisioning logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task14-${{ matrix.profile }}-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/task14-${{ matrix.profile }}/summary.json
            ${{ runner.temp }}/task14-${{ matrix.profile }}/**/case.json
            ${{ runner.temp }}/task14-${{ matrix.profile }}/**/request.json
            ${{ runner.temp }}/task14-${{ matrix.profile }}/**/result.json
            ${{ runner.temp }}/task14-${{ matrix.profile }}/**/observation.json
            ${{ runner.temp }}/task14-${{ matrix.profile }}/**/previous-head-rejection.json
            ${{ runner.temp }}/task14-${{ matrix.profile }}/**/reports/**
            ${{ runner.temp }}/task14-${{ matrix.profile }}/**/*.log
  alternate:
    name: React SSR / Jest / alternate Node and npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - name: Derive alternate consumer choices
        id: selection
        run: cargo run --locked -p project-verification -- ci-inputs examples/react-jest/project-profile.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.selection.outputs.node_version }}
      - name: Provision the selected npm release
        run: |
          cargo run --locked -p project-verification -- provision-npm examples/react-jest/project-profile.json --prefix '${{ runner.temp }}/selected-npm'
          echo '${{ runner.temp }}/selected-npm/node_modules/.bin' >> "$GITHUB_PATH"
      - name: Native Jest baseline and negative cases
        env:
          POLICY_JEST_OUTPUT: ${{ runner.temp }}/task15-jest
        run: cargo test --locked -p policy-acceptance --test native_jest -- --ignored --nocapture
      - name: Retain observations and native reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: task15-jest-${{ github.sha }}
          include-hidden-files: true
          retention-days: 30
          path: |
            ${{ runner.temp }}/task15-jest/summary.json
            ${{ runner.temp }}/task15-jest/*/request.json
            ${{ runner.temp }}/task15-jest/*/result.json
            ${{ runner.temp }}/task15-jest/*/original-report.json
            ${{ runner.temp }}/task15-jest/*.log
            ${{ runner.temp }}/task15-jest/previous-head-rejection.json
