name: Promotion mutation evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pinned Rust and mutation tool
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          cargo install cargo-mutants --version 27.1.0 --locked
          cargo fetch --locked
      - name: Exercise complete generated inventory and typed replacements
        run: cargo run --locked --offline -p xtask -- run-mutation-suite target/promotion-mutation
      - name: Reject incomplete or undetected mutation evidence
        if: always()
        run: cargo run --locked --offline -p xtask -- check-mutation-suite target/promotion-mutation
      - name: Upload exact-head mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-evidence-${{ github.sha }}
          path: target/promotion-mutation/
          if-no-files-found: error
          retention-days: 30
