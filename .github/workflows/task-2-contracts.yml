name: Task 2 contracts

on:
  push:
    branches: [feat/initial-policy-kernel]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Generate lockfile for capture
        run: |
          cargo generate-lockfile
          echo "LOCKFILE_BASE64=$(base64 -w0 Cargo.lock)"
      - run: cargo test -p policy-contracts
