name: Task 2 contracts

on:
  push:
    branches: [feat/initial-policy-kernel]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy -p policy-contracts --all-targets --locked -- -D warnings
